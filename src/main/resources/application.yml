spring:
  application:
    name: orchestrix

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${ORCHESTRIX_DB_URL:jdbc:mysql://localhost:3306/orchestrix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ORCHESTRIX_DB_USER:orchestrix}
    password: ${ORCHESTRIX_DB_PASSWORD:orchestrix}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${ORCHESTRIX_REDIS_HOST:localhost}
      port: ${ORCHESTRIX_REDIS_PORT:6379}
      timeout: 2000ms

server:
  port: ${ORCHESTRIX_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: orchestrix
    distribution:
      percentiles-histogram:
        http.server.requests: true
        orchestrix.llm.latency: true
      percentiles:
        orchestrix.llm.latency: 0.5,0.95,0.99

orchestrix:
  # Execution mode controls how upstream provider calls are served:
  #   MOCK   - never call upstream; deterministic mock responses (demo-safe).
  #   REAL   - call upstream; if a provider has no credentials configured,
  #            return a mock for that provider with reason "credentials missing".
  #   HYBRID - try real, fall back to a mock for the same provider on any
  #            failure (missing creds, connection refused, timeout, error).
  # Routing engine, fallback chain, and tenant policy are unchanged across modes.
  mode: ${ORCHESTRIX_MODE:HYBRID}

  cache:
    enabled: ${ORCHESTRIX_CACHE_ENABLED:true}
    ttl-seconds: 600
    redis-enabled: ${ORCHESTRIX_REDIS_ENABLED:false}
    in-memory-max-entries: 5000

  routing:
    weight-complexity: 0.5
    weight-reliability: 0.3
    weight-cost: 0.2
    # Tier thresholds are calibrated for the natural range of the documented
    # scoring formula (~0.5..~5.5 in practice). See DESIGN.md.
    score-low-tier-max: 1.5
    score-mid-tier-max: 3.5

  resilience:
    request-timeout-ms: 30000
    max-retries: 3
    retry-base-backoff-ms: 200

  providers:
    openai:
      enabled: true
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:sk-test-placeholder}
      cost-per-1k-input-tokens: 0.150
      cost-per-1k-output-tokens: 0.600
      models:
        low: gpt-4o-mini
        mid: gpt-4o-mini
        high: gpt-4o

    anthropic:
      enabled: ${ANTHROPIC_ENABLED:false}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      cost-per-1k-input-tokens: 3.000
      cost-per-1k-output-tokens: 15.000
      models:
        low: claude-3-haiku-20240307
        mid: claude-3-5-sonnet-20241022
        high: claude-3-5-sonnet-20241022

    ollama:
      enabled: true
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      cost-per-1k-input-tokens: 0.000
      cost-per-1k-output-tokens: 0.000
      models:
        low: llama3.2
        mid: llama3.1
        high: llama3.1

  fallback-chain:
    - OPENAI
    - ANTHROPIC
    - OLLAMA

  failure-injection:
    enabled: true

logging:
  level:
    root: INFO
    com.orchestrix: INFO
    org.hibernate.SQL: WARN
  config: classpath:logback-spring.xml

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:orchestrix;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

orchestrix:
  cache:
    redis-enabled: false

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:orchestrix-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true

orchestrix:
  cache:
    redis-enabled: false
  providers:
    openai:
      api-key: test-key
      base-url: http://localhost:0
    ollama:
      base-url: http://localhost:0
